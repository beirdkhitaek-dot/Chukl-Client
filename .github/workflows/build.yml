name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | while IFS= read -r line; do
            printf '%s\n' "$line"
            if printf '%s\n' "$line" | grep -qE '\.java:[0-9]+: error'; then
              printf '::error::%s\n' "$line"
            fi
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: chukl-client
          path: build/libs/*.jar

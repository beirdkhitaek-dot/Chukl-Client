name: Release

on:
  workflow_dispatch:
    inputs:
      update_name:
        description: "Update name (shown in the release title)"
        required: true
        default: "Initial release"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Read version
        id: v
        run: echo "version=$(grep '^mod-version' gradle/libs.versions.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: gradle build --no-daemon
      - name: Name the jar with the version
        run: cp build/libs/chukl-client-${{ steps.v.outputs.version }}.jar chukl-client-${{ steps.v.outputs.version }}.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: "v${{ steps.v.outputs.version }} - ${{ inputs.update_name }}"
          files: chukl-client-${{ steps.v.outputs.version }}.jar
